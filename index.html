<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F6F7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的课表">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<link rel="apple-touch-icon" href="./logo.svg">
<link rel="stylesheet" href="./app.css">
<title>我的课表</title>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand"><img src="./logo.svg" alt="我的课表"><div><h1>我的课表</h1><p id="todayText">—</p></div></div>
      <button class="week-chip" id="weekPickerBtn" type="button"><span id="weekChipText">第—周</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 7.5 10 12l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <main>
    <section class="screen" id="screen-schedule">
      <section class="focus-card pressable" id="focusCard">
        <div class="focus-top"><span class="eyebrow">下一节课程</span><span class="focus-status" id="nextStatus">—</span></div>
        <div id="nextLesson"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2 id="dayTitle">今天</h2><p id="daySubtitle">—</p></div><button class="text-btn" id="goTodayBtn" type="button">回到今天</button></div>
        <div class="agenda" id="dayAgenda"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>本周特殊安排</h2><p>调课、停课、实训周与普通课程分开展示</p></div></div>
        <div class="special-list" id="todaySpecial"></div>
      </section>
    </section>

    <section class="screen hidden" id="screen-stats">
      <section class="week-panel" id="weekSwipeArea">
        <div class="week-panel-head">
          <div class="week-panel-title"><b id="selectedWeekTitle">第—周</b><span id="selectedWeekRange">—</span></div>
          <div class="week-panel-actions">
            <button class="week-arrow" id="prevWeekBtn" type="button" aria-label="上一周">‹</button>
            <button class="current-week-btn" id="currentWeekBtn" type="button">本周</button>
            <button class="week-arrow" id="nextWeekBtn" type="button" aria-label="下一周">›</button>
          </div>
        </div>
        <div class="week-rail-free" id="weekRail"></div>
        <div class="swipe-hint">左右滑动切换周次，也可以直接点任意教学周</div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>本周特殊安排</h2><p>特殊事件单独呈现，不与普通课程混排</p></div></div>
        <div class="special-list" id="weekSpecial"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>周课表</h2><p id="weekHoursText">—</p></div></div>
        <div class="date-rail" id="dateRail"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2 id="weekDayTitle">当天课程</h2><p id="weekDaySubtitle">—</p></div></div>
        <div class="agenda" id="weekDayAgenda"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>整周总览</h2><p>按星期分组浏览本周全部课程</p></div></div>
        <div class="week-overview" id="weekOverview"></div>
      </section>
    </section>

    <section class="screen hidden" id="screen-all">
      <section class="search-card">
        <div class="search-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="keyword" placeholder="搜索课程、班级、教室"></div>
        <div class="filter-row"><select id="weekFilter"><option value="all">全部周次</option></select><select id="classFilter"><option value="all">全部班级</option></select><select id="courseFilter"><option value="all">全部课程</option></select></div>
      </section>
      <div class="result-head"><h2>课程明细</h2><span id="resultCount">0 条</span></div>
      <div class="all-list" id="allList"></div>
    </section>
  </main>
</div>

<nav class="tabbar" aria-label="主导航">
  <button class="tab-item active" data-screen="schedule" type="button"><svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M5 8h14M6 5h12a2 2 0 0 1 2 2v12H4V7a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="14" r="2.2" fill="currentColor"/></svg><span>今天</span></button>
  <button class="tab-item" data-screen="stats" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M4 10h16M8 14h2M12 14h2M16 14h1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>周课表</span></button>
  <button class="tab-item" data-screen="all" type="button"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>全部课程</span></button>
</nav>

<div class="sheet-mask" id="lessonMask" aria-hidden="true">
  <section class="sheet lesson-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div id="sheetTags"></div><button class="sheet-close" id="lessonClose" type="button">×</button></div>
    <h2 id="sheetCourse">课程</h2>
    <p class="sheet-class" id="sheetClass">班级</p>
    <div class="detail-list">
      <div><span>日期</span><b id="sheetDate">—</b></div>
      <div><span>节次</span><b id="sheetPeriod">—</b></div>
      <div><span>教室</span><b id="sheetLocation">—</b></div>
      <div><span>教学班</span><b id="sheetGroup">—</b></div>
      <div><span>备注</span><b id="sheetNote">—</b></div>
    </div>
  </section>
</div>

<div class="sheet-mask" id="weekMask" aria-hidden="true">
  <section class="sheet week-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div><h2>选择教学周</h2><p>2026–2027学年第1学期</p></div><button class="sheet-close" id="weekClose" type="button">×</button></div>
    <button class="picker-current-btn" id="pickerCurrentBtn" type="button">回到当前周</button><div class="week-grid-picker" id="weekGridPicker"></div>
  </section>
</div>

<script src="./schedule-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
