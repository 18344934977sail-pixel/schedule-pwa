<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F6F7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的课表">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<link rel="apple-touch-icon" href="./logo.svg">
<link rel="stylesheet" href="./app.css">
<title>我的课表</title>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand"><img src="./logo.svg" alt="我的课表"><div><h1>我的课表</h1><p id="todayText">—</p></div></div>
      <button class="week-chip" id="weekPickerBtn" type="button"><span id="weekChipText">第—周</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 7.5 10 12l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <main>
    <section class="screen" id="screen-schedule">
      <section class="focus-card" id="focusCard">
        <div class="focus-top"><span class="eyebrow">下一节课程</span><span class="focus-status" id="nextStatus">—</span></div>
        <div id="nextLesson"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>本周</h2><p id="weekRangeText">—</p></div><div class="week-summary" id="weekSummary">0 课时</div></div>
        <div class="date-rail" id="dateRail"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2 id="dayTitle">今天课程</h2><p id="daySubtitle">—</p></div><button class="text-btn" id="goTodayBtn" type="button">今天</button></div>
        <div class="agenda" id="dayAgenda"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>本周总览</h2><p>按天查看整周课程，不需要横向拖大表格</p></div></div>
        <div class="week-overview" id="weekOverview"></div>
      </section>
    </section>

    <section class="screen hidden" id="screen-stats">
      <section class="stats-hero">
        <div><span>学期实际课时</span><strong>268</strong><small>最终执行口径</small></div>
        <div class="stats-mini"><b id="statWeekHours">0h</b><span>当前周</span></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>16周课时</h2><p>点击周次可直接跳回该周课程表</p></div></div>
        <div class="week-chart" id="weekChart"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>班级负荷</h2><p>每个班级固定一种颜色</p></div></div>
        <div class="load-list" id="classLoad"></div>
      </section>

      <section class="section-block">
        <div class="section-head"><div><h2>课程结构</h2><p>课程课时在全学期中的占比</p></div></div>
        <div class="course-list" id="courseLoad"></div>
      </section>

      <section class="rule-card"><b>第16周规则</b><p>数字媒体技术2501进行《用户界面设计综合实训》。周一至周五1–6节为实训占用，仅7–8节可正常安排常规课程；周一7–8节《用户界面设计》保留。</p></section>
    </section>

    <section class="screen hidden" id="screen-all">
      <section class="search-card">
        <div class="search-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="keyword" placeholder="搜索课程、班级、教室"></div>
        <div class="filter-row"><select id="weekFilter"><option value="all">全部周次</option></select><select id="classFilter"><option value="all">全部班级</option></select><select id="courseFilter"><option value="all">全部课程</option></select></div>
      </section>
      <div class="result-head"><h2>课程明细</h2><span id="resultCount">0 条</span></div>
      <div class="all-list" id="allList"></div>
    </section>
  </main>
</div>

<nav class="tabbar" aria-label="主导航">
  <button class="tab-item active" data-screen="schedule" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>课程表</span></button>
  <button class="tab-item" data-screen="stats" type="button"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>统计</span></button>
  <button class="tab-item" data-screen="all" type="button"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>全部</span></button>
</nav>

<div class="sheet-mask" id="lessonMask" aria-hidden="true">
  <section class="sheet lesson-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div id="sheetTags"></div><button class="sheet-close" id="lessonClose" type="button">×</button></div>
    <h2 id="sheetCourse">课程</h2>
    <p class="sheet-class" id="sheetClass">班级</p>
    <div class="detail-list">
      <div><span>日期</span><b id="sheetDate">—</b></div>
      <div><span>节次</span><b id="sheetPeriod">—</b></div>
      <div><span>地点</span><b id="sheetLocation">—</b></div>
      <div><span>教学班</span><b id="sheetGroup">—</b></div>
      <div><span>备注</span><b id="sheetNote">—</b></div>
    </div>
  </section>
</div>

<div class="sheet-mask" id="weekMask" aria-hidden="true">
  <section class="sheet week-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div><h2>选择教学周</h2><p>2026–2027学年第1学期</p></div><button class="sheet-close" id="weekClose" type="button">×</button></div>
    <div class="week-grid-picker" id="weekGridPicker"></div>
  </section>
</div>

<script src="./schedule-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
